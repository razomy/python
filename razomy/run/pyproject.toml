[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "razomy_run"
version = "0.0.1-beta.8"
description = "Shared logging utility"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
]

[tool.hatch.build.targets.wheel.sources]
"" = "razomy/run"

[tool.hatch.build.targets.wheel]
include = [
    "*.py"
]
exclude = [
    "*_test.py"
]

[tool.hatch.build.targets.sdist]
exclude = [
    "*_test.py"
]